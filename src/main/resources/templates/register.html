<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head th:replace="fragments/head">
</head>
<body>
<main class="p-5 align-content-center bg-blur my-register-div">
    <h1 class="border-bottom">Register</h1>
    <div class="d-flex justify-content-center ">
        <div class="row g-3">
            <form
                    th:object="${registerData}"
                    th:action="@{/register}"
                    th:method="POST">
                <div>
                    <div class="col-auto">
                        <label for="inputUsername" class="col-form-label ">Username</label>
                    </div>
                    <div class="col-auto">
                        <input
                                th:field="*{username}"
                                th:errorclass="is-invalid"
                                name="username"
                               required minlength="5" maxlength="20"
                               type="text"
                               id="inputUsername"
                               class="form-control"
                               aria-describedby="usernameHelpInline">
<!--                        <small th:errors="*{username}" id="usernameError"-->
<!--                               class="invalid-feedback bg-danger rounded">Username length must be more than 3 characters</small>-->

<!--                      th:if="${#fields.hasErrors('username')}" id="usernameUniqueError"-->
                        <small th:errors="*{username}" id="usernameUniqueError"
                               class="invalid-feedback text-white bg-danger rounded"></small>

<!--                        <th:block th:if="${#fields.hasErrors('username')}">-->
<!--                                                        <small th:each="error: ${#fields.detailedErrors('username')}"-->
<!--                                                               th:text="${error.getMessage()}"-->
<!--                                                               class="bg-danger text-white rounded d-block">Username is already occupied</small>-->
<!--                                                    </th:block>-->

                    </div>
                </div>

                <div>
                    <div class="col-auto">
                        <label for="inputFullName" class="col-form-label ">Full Name</label>
                    </div>
                    <div class="col-auto">
                        <input name="fullName"
                               th:field="*{fullName}"
                               th:errorclass="is-invalid"
                               required minlength="2" maxlength="30"
                               type="text"
                               id="inputFullName"
                               class="form-control"
                               aria-describedby="fullNameHelpInline">
                        <small th:errors="*{fullName}" id="fullNameError"
                               class="invalid-feedback text-white bg-danger rounded"></small>
                    </div>
                </div>

                <div>
                    <div class="col-auto">
                        <label for="inputEmail" class="col-form-label ">Email</label>
                    </div>
                    <div class="col-auto">
                        <input name="email"
                               th:field="*{email}"
                               th:errorclass="is-invalid"
								required
                               type="email"
                               id="inputEmail"
                               class="form-control"
                               aria-describedby="emailHelpInline">
                        <small th:errors="*{email}" id="emailError"
                               class="invalid-feedback text-white form-text bg-danger rounded"></small>
                    </div>
                </div>

                <div>
                    <div class="col-auto">
                        <label for="inputAge" class="col-form-label ">Age</label>
                    </div>
                    <div class="col-auto">
                        <input name="age" required
                               th:field="*{age}"
                               th:errorclass="is-invalid"
                               type="number"
                               id="inputAge"
                               class="form-control"
                               min="0" max="90"
                               aria-describedby="ageHelpInline">
                        <small id="ageError" th:errors="*{age}"
                               class="invalid-feedback text-white form-text bg-danger rounded">Please insert valid age!</small>
                    </div>
                </div>
                <div>

                    <div>
                        <div class="col-auto">
                            <label for="selectLevel" class="col-form-label ">Level</label>
                        </div>
                        <div class="col-auto">
                            <select name="level"
                                    th:field="*{level}"
                                    type=""
                                    id="selectLevel"
                                    class="form-control">
                                <option th:each="levelOption: ${levels}" th:value="${levelOption}" th:text="${levelOption}"/>
                            </select>
                        </div>
                    </div>

                    <div class="col-auto">
                        <label for="inputPassword" class="col-form-label ">Password</label>
                    </div>
                    <div class="col-auto">
                        <input name="password"
                                required minlength="5" maxlength="200"
                               th:field="*{password}"
                               th:errorclass="is-invalid"
                               type="password"
                               id="inputPassword"
                               class="form-control"
                               aria-describedby="passwordHelpInline">
                        <small id="passwordError" th:errors="*{password}"
                               class="invalid-feedback text-white form-text bg-danger rounded">
                            Password length must be between 5 and 200 characters and passwords should match.
                        </small>
                    </div>
                </div>

                <div>
                    <div class="col-auto">
                        <label for="inputConfirmPassword" class="col-form-label ">Confirm Password</label>
                    </div>
                    <div class="col-auto">
                        <input name="confirmPassword"
                                required minlength="5" maxlength="200"
                               th:field="*{confirmPassword}"
                               th:errorclass="is-invalid"
                               type="password"
                               id="inputConfirmPassword"
                               class="form-control"
                               aria-describedby="confirmPasswordHelpInline">
                        <small id="confirmPasswordError" th:errors="*{confirmPassword}"
                               class="invalid-feedback text-white form-text bg-danger rounded">
                            Password length must be between 5 and 200 characters and passwords should match.
                        </small>
                    </div>
                </div>

                <div class="d-flex justify-content-center mt-4">
                    <button class="btn btn-primary btn-block w-50" type="submit">Register</button>
                </div>

            </form>
        </div>
    </div>
</main>
<footer th:replace="fragments/footer">
</footer>
</body>
</html>
